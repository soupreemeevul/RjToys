<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RJtoys</title>
  <link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
  rel="stylesheet"
  integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
  crossorigin="anonymous">
<style>
  h1{
display: inline-block;
background: linear-gradient(to right, #002e5c, #03d878);
background-clip: text;
-webkit-background-clip: text;
color: transparent;
  }
</style>
</head>
<body>
  <header class="container pt-4">
    <h1>RJtoys</h1>
  </header>
  <main class="container my-5">
    <h2 class="mb-3">On the workbench</h2>

    <figure class="card" style="max-width: 22rem;">
      <img
        src="images/workbench-01.jpg"
        class="card-img-top img-fluid"
        width="710"
        height="1536"
        alt="White-and-blue custom action figure lying on a cutting mat during construction."
      >

      <figcaption class="card-body">
        <p class="card-text mb-0">
          <strong>Work in progress.</strong>
          A custom figure on the RJ Toys workbench.
        </p>
      </figcaption>
    </figure>
  </main>
</body>
</html>
